name: Test error handling - invalid input name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          input: nonexistent-dependency
          lockfile: tests/fixtures/flake.lock
      - name: Assert action failed gracefully on invalid input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected for nonexistent dependency"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for nonexistent dependency"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
