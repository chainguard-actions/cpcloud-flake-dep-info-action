name: Test error handling for missing flake input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          input: nonexistent-dep
          lockfile: ${{ github.workspace }}/tests/fixtures/flake.lock

      - name: Assert action failed gracefully for missing input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for nonexistent input, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for nonexistent flake input"
