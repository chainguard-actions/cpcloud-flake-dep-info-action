name: Test error handling - invalid input name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify fixture lockfile exists
        run: |
          ls -la "$GITHUB_WORKSPACE/tests/fixtures/flake.lock"
          echo "Lockfile found at: $GITHUB_WORKSPACE/tests/fixtures/flake.lock"
      - id: action
        uses: .
        continue-on-error: true
        with:
          input: nonexistent-input
          lockfile: ${{ github.workspace }}/tests/fixtures/flake.lock
      - name: Assert action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for nonexistent input, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed gracefully for nonexistent input"
