name: Test flake-utils input lookup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          input: flake-utils
          lockfile: ${{ github.workspace }}/tests/fixtures/flake.lock

      - name: Assert owner output
        env:
          ACTUAL: ${{ steps.action.outputs.owner }}
        run: |
          echo "owner: $ACTUAL"
          if [ "$ACTUAL" != "numtide" ]; then
            echo "FAIL: expected owner 'numtide', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert repo output
        env:
          ACTUAL: ${{ steps.action.outputs.repo }}
        run: |
          echo "repo: $ACTUAL"
          if [ "$ACTUAL" != "flake-utils" ]; then
            echo "FAIL: expected repo 'flake-utils', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert rev output
        env:
          ACTUAL: ${{ steps.action.outputs.rev }}
        run: |
          echo "rev: $ACTUAL"
          if [ "$ACTUAL" != "c91f3de5adaf1de973b797ef7485e441a65b8935" ]; then
            echo "FAIL: expected rev 'c91f3de5adaf1de973b797ef7485e441a65b8935', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert short-rev output (default 8 chars)
        env:
          ACTUAL: ${{ steps.action.outputs.short-rev }}
        run: |
          echo "short-rev: $ACTUAL"
          if [ "$ACTUAL" != "c91f3de5" ]; then
            echo "FAIL: expected short-rev 'c91f3de5', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
