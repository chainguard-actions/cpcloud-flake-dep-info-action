name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          input: nixpkgs
          lockfile: ${{ github.workspace }}/tests/fixtures/flake.lock

      - name: Assert owner output
        env:
          ACTUAL: ${{ steps.action.outputs.owner }}
        run: |
          echo "actual owner: $ACTUAL"
          if [ "$ACTUAL" != "NixOS" ]; then
            echo "FAIL: expected owner 'NixOS', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert repo output
        env:
          ACTUAL: ${{ steps.action.outputs.repo }}
        run: |
          echo "actual repo: $ACTUAL"
          if [ "$ACTUAL" != "nixpkgs" ]; then
            echo "FAIL: expected repo 'nixpkgs', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert rev output
        env:
          ACTUAL: ${{ steps.action.outputs.rev }}
        run: |
          echo "actual rev: $ACTUAL"
          if [ "$ACTUAL" != "4a76638020344ae8a9f061856431182179ab0d28" ]; then
            echo "FAIL: expected full rev '4a76638020344ae8a9f061856431182179ab0d28', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert short-rev output (default 8 chars)
        env:
          ACTUAL: ${{ steps.action.outputs.short-rev }}
        run: |
          echo "actual short-rev: $ACTUAL"
          if [ "$ACTUAL" != "4a766380" ]; then
            echo "FAIL: expected short-rev '4a766380', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
