name: Test basic usage - nixpkgs dependency
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          input: nixpkgs
          lockfile: tests/fixtures/flake.lock
      - name: Assert owner output
        env:
          ACTUAL: ${{ steps.action.outputs.owner }}
        run: |
          echo "owner: $ACTUAL"
          if [ "$ACTUAL" != "NixOS" ]; then
            echo "FAIL: expected owner 'NixOS', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert repo output
        env:
          ACTUAL: ${{ steps.action.outputs.repo }}
        run: |
          echo "repo: $ACTUAL"
          if [ "$ACTUAL" != "nixpkgs" ]; then
            echo "FAIL: expected repo 'nixpkgs', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert rev output
        env:
          ACTUAL: ${{ steps.action.outputs.rev }}
        run: |
          echo "rev: $ACTUAL"
          if [ "$ACTUAL" != "76612b17c0ce71689921ca12d9ffdc9c23ce40b2" ]; then
            echo "FAIL: expected rev '76612b17c0ce71689921ca12d9ffdc9c23ce40b2', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert short-rev output (default 8 chars)
        env:
          ACTUAL: ${{ steps.action.outputs.short-rev }}
        run: |
          echo "short-rev: $ACTUAL"
          if [ "$ACTUAL" != "76612b17" ]; then
            echo "FAIL: expected short-rev '76612b17', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
