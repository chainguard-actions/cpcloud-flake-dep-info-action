name: Test basic usage - nixpkgs input from default lockfile
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify fixture lockfile exists
        run: |
          ls -la "$GITHUB_WORKSPACE/tests/fixtures/flake.lock"
          echo "Lockfile found at: $GITHUB_WORKSPACE/tests/fixtures/flake.lock"
      - id: action
        uses: .
        with:
          input: nixpkgs
          lockfile: ${{ github.workspace }}/tests/fixtures/flake.lock
      - name: Assert owner
        env:
          ACTUAL: ${{ steps.action.outputs.owner }}
        run: |
          echo "actual owner: $ACTUAL"
          if [ "$ACTUAL" != "NixOS" ]; then
            echo "FAIL: expected owner 'NixOS', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert repo
        env:
          ACTUAL: ${{ steps.action.outputs.repo }}
        run: |
          echo "actual repo: $ACTUAL"
          if [ "$ACTUAL" != "nixpkgs" ]; then
            echo "FAIL: expected repo 'nixpkgs', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert rev
        env:
          ACTUAL: ${{ steps.action.outputs.rev }}
        run: |
          echo "actual rev: $ACTUAL"
          if [ "$ACTUAL" != "b139bf1c47c6660cd0f5e2d3448e05e82da2ea6b" ]; then
            echo "FAIL: expected rev 'b139bf1c47c6660cd0f5e2d3448e05e82da2ea6b', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert short-rev (default 8 chars)
        env:
          ACTUAL: ${{ steps.action.outputs.short-rev }}
        run: |
          echo "actual short-rev: $ACTUAL"
          if [ "$ACTUAL" != "b139bf1c" ]; then
            echo "FAIL: expected short-rev 'b139bf1c', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
